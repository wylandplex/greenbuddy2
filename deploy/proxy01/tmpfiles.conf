# Flüchtige GB2-Beobachtung auf proxy01; das Register bleibt persistent.
d /run/greenbuddy 0755 root root -
d /run/greenbuddy/log 0700 gb-stellvertreter gb-stellvertreter -
d /run/greenbuddy/stellvertreter 0700 gb-stellvertreter gb-stellvertreter -
# Statusbericht des Stellvertreters, lesbar für den SSH-Zwangsbefehl (gb-register).
d /run/greenbuddy/status 2750 gb-stellvertreter gb-register -
