# GreenBuddy 2 (Übernahme schlafender Hosts): ARP nur für Adressen der Empfangs-NIC beantworten
# und ARP-Anfragen mit der zur Ziel-IP passenden eigenen Adresse stellen. gb-stellvertreter prüft
# diese Werte vor jeder Übernahme und übernimmt ohne sie nie.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.eth0.arp_ignore = 1
net.ipv4.conf.eth0.arp_announce = 2
